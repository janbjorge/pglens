[project]
name = "pglens"
version = "0.1.0"
description = "PostgreSQL MCP server for schema inspection, data exploration, and query execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "asyncpg>=0.29",
    "mcp>=1.0",
]

[project.scripts]
pglens = "pglens.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pglens"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
